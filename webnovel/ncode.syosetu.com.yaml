# ------------------------------------------------------------
# 小説サイト定義
name: &name 小説家になろう
domain: ncode.syosetu.com
top_url: https://\\k<domain>
url: https?://\\k<domain>/(?<ncode>n\d+[a-z]+)
encoding: UTF-8
confirm_over18: no
append_title_to_folder_name: yes
title_strip_pattern: null
cookie: over18=yes
sitename: *name
version: 2.1

# ------------------------------------------------------------
# 目次取得設定
toc_url: https://\\k<domain>/\\k<ncode>/
subtitles: |-
  (?:<div class="p-eplist__chapter-title">(?<chapter>.+?)</div>\s*
  )?<div class="p-eplist__sublist">\s*
  <a href="(?<href>/.+?/(?<index>\d+?)/)" class="p-eplist__subtitle">\s*
  (?<subtitle>.+?)\s*
  </a>\s*

  <div class="p-eplist__update">\s*
  (?:<span class="p-eplist__favep">.+?</span></span>)?\s*(?<subdate>.+?)\s*
  (?:<span title="(?<subupdate>.+?) 改稿">（<u>改</u>）</span>
  )?</div>\s*
  </div>
next_toc: <a href="/(?<next_page>[^"]+)" class="c-pager__item c-pager__item--next">
next_url: https://\\k<domain>/\\k<next_page>
# 最大のページ数を得る。固定の数字でも可。
toc_page_max: <a href="/[^"]+p=(?<toc_page_max>\d+)" class="c-pager__item c-pager__item--last">

# ------------------------------------------------------------
# 本文取得設定
body_pattern: |-
  <div class="js-novel-text p-novel__text">
  (?<body>.+?)
  ?</div>
introduction_pattern: |-
  <div class="js-novel-text p-novel__text p-novel__text--preface">
  (?<introduction>.+?)
  ?</div>
postscript_pattern: |-
  <div class="js-novel-text p-novel__text p-novel__text--afterword">
  (?<postscript>.+?)
  ?</div>

illust_current_url: null
illust_grep_pattern: null

# ------------------------------------------------------------
# 特殊な設定
is_narou: true
narou_api_url: https://api.syosetu.com/novelapi/api/

# ------------------------------------------------------------
# 小説情報からパースするための設定
novel_info_url: \\k<top_url>/novelview/infotop/ncode/\\k<ncode>/

# タイトル
t: <h1 class="p-infotop-title">\s*<a href=".+?">(?<title>.+?)</a>\s*</h1>

# novel_type 小説種別
nt: <span class="p-infotop-type__type(?:.*?)">\s*(?<novel_type>.+?)\s*</span>
novel_type_string:
  連載中: 1
  完結済: 3
  短編: 2

# general_all_no 掲載話数
ga: <span class="p-infotop-type__allep">\s*全(?<general_all_no>\d+)\s*エピソード

# story あらすじ
s: |-
  <dt class="p-infotop-data__title">\s*あらすじ\s*</dt>\s*
  <dd class="p-infotop-data__value">\s*(?<story>.+?)\s*</dd>

# general_firstup 初回掲載日
gf: |-
  <dt class="p-infotop-data__title">\s*掲載日\s*</dt>\s*
  <dd class="p-infotop-data__value">\s*(?<general_firstup>.+?)\s*</dd>

# novelupdated_at 小説の更新時刻。連載小説だと書いてないので最終掲載日で代用
nu: |-
  <dt class="p-infotop-data__title">\s*(?:最終更新日|最新掲載日|最終掲載日)\s*</dt>\s*
  <dd class="p-infotop-data__value">\s*(?<novelupdated_at>.+?)\s*</dd>

# general_lastup 最終掲載日
gl: |-
  <dt class="p-infotop-data__title">\s*(?:最新掲載日|最終掲載日)\s*</dt>\s*
  <dd class="p-infotop-data__value">\s*(?<general_lastup>.+?)\s*</dd>

# writer 作者名
w: |-
  <dt class="p-infotop-data__title">\s*作者名\s*</dt>\s*
  <dd class="p-infotop-data__value">\s*(?:<a href=".+?">)?(?<writer>.+?)(?:</a>)?\s*</dd>

# length 文字数
l: |-
  <dt class="p-infotop-data__title">\s*文字数\s*</dt>\s*
  <dd class="p-infotop-data__value">\s*(?<length>[\d,]+)\s*文字\s*</dd>
